name: Sashiosae cloud publishing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only connection test, publish, or monitor'
        type: choice
        options: [diagnose, publish, monitor, redesign]
        default: diagnose
  schedule:
    - cron: '17 0 * * *'
    - cron: '37 6,12 * * *'
permissions:
  contents: write
concurrency:
  group: sashiosae-cloud-publishing
  cancel-in-progress: false
jobs:
  key-renewal-reminder:
    if: github.event_name == 'schedule' && github.event.schedule == '17 0 * * *'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Notify before Buffer key expiry without stopping publishing
        run: |
          python - <<'PY'
          import datetime
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          if today == datetime.date(2027, 10, 25):
              raise SystemExit('Buffer key expires 2027-11-01. Renew Sashiosae cloud posting, update BUFFER_API_KEY in repository Secrets, and run Social connection check. Do not paste keys in chat. Publishing runs independently of this reminder.')
          print('No key renewal reminder due today.')
          PY
  publish:
    if: vars.SOCIAL_CLOUD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          fi
          python -m pip install -r social/requirements.txt
      - name: Configure journal commits
        run: |
          git config user.name 'social-publishing-bot'
          git config user.email 'social-publishing-bot@users.noreply.github.com'
      - name: Validate
        run: python -m unittest discover -s tests -p 'test_social_cloud.py'
      - name: Generate and schedule, or check publication
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = 'diagnose' ]; then
            python social/runner.py --diagnose
          elif [ "$OPERATION" = 'redesign' ]; then
            python social/rescue_redesign.py
          elif [ "$EVENT_SCHEDULE" = '37 6,12 * * *' ] || [ "$OPERATION" = 'monitor' ]; then
            python social/runner.py --monitor-only
          else
            python social/runner.py
          fi

