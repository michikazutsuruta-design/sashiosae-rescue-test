name: Ride cloud publishing
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Connection check, build reservations, publish due Threads, or monitor'
        type: choice
        options: [diagnose, build, threads, monitor, photos, catchup]
        default: diagnose
  schedule:
    - cron: '27 0,3,6,9 * * *'
    - cron: '7 7 * * *'
    - cron: '7,37 13 * * *'
    - cron: '7 14 * * *'
    - cron: '37 14 * * *'
permissions:
  contents: write
concurrency:
  group: ride-cloud-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: vars.RIDE_CLOUD_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          python -m pip install -r social/requirements.txt imageio-ffmpeg==0.6.0
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from urllib.request import urlopen
          import imageio_ffmpeg
          from PIL import ImageFont
          font = Path(os.environ['RUNNER_TEMP']) / 'ride-NotoSansCJK-Regular.ttc'
          url = 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc'
          with urlopen(url, timeout=60) as response:
              font.write_bytes(response.read())
          ImageFont.truetype(str(font), 43)
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ffmpeg, '-version'], check=True, stdout=subprocess.DEVNULL)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOCIAL_FONT=' + str(font) + '\n')
              env.write('SOCIAL_FFMPEG=' + ffmpeg + '\n')
          PY
      - name: Configure journal commits
        run: |
          git config user.name 'ride-publishing-bot'
          git config user.email 'ride-publishing-bot@users.noreply.github.com'
      - name: Check scheduling and content safeguards
        run: python -m unittest discover -s tests -p 'test_ride_cloud.py'
      - name: Verify and operate Ride only
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          RIDE_THREADS_ACCESS_TOKEN: ${{ secrets.RIDE_THREADS_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$OPERATION" ]; then
            python social/ride_runner.py "$OPERATION"
          elif [ "$EVENT_SCHEDULE" = '27 0,3,6,9 * * *' ]; then
            python social/ride_runner.py build
          elif [ "$EVENT_SCHEDULE" = '37 14 * * *' ]; then
            python social/ride_runner.py catchup
          elif [ "$EVENT_SCHEDULE" = '7,37 13 * * *' ] || [ "$EVENT_SCHEDULE" = '7 14 * * *' ]; then
            python social/ride_runner.py threads
          else
            python social/ride_runner.py monitor
          fi

