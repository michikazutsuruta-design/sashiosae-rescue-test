name: Little Compass Japan cloud publishing
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Verify connection without posting, publish due daily posts, or monitor
        options: [diagnose, publish, monitor]
        default: diagnose
  schedule:
    - cron: '0,17,47 5 * * *'
    - cron: '17 6,7,8,9,10,11,12,13,14 * * *'
permissions:
  contents: write
concurrency:
  group: little-compass-japan-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<47'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lcj-token-cache
          key: lcj-token-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lcj-token-v1-
      - name: Configure journal commits
        run: |
          git config user.name 'little-compass-publishing-bot'
          git config user.email 'little-compass-publishing-bot@users.noreply.github.com'
      - name: Test scheduling and no-resend safeguards
        run: python -m unittest discover -s tests -p 'test_lcj_cloud.py'
      - name: Operate Little Compass Japan only
        env:
          LCJ_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.LCJ_INSTAGRAM_ACCESS_TOKEN }}
          LCJ_THREADS_ACCESS_TOKEN: ${{ secrets.LCJ_THREADS_ACCESS_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: python social/lcj_runner.py "${OPERATION:-publish}"
