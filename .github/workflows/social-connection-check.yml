name: Social connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check connections without publishing
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -u - <<'PY'
          import sys, datetime as dt
          sys.path.insert(0, 'social')
          import runner as r
          config = r.load(r.CONFIG, {})
          for name in ('BUFFER_API_KEY',):
              value = r.os.environ.get(name, '')
              if not value or not value.isascii() or any(c.isspace() for c in value):
                  raise RuntimeError(name + ': invalid secret format; paste original key directly in GitHub')
          channels = r.channels(config)
          print('Buffer authenticated; both posting accounts verified.', flush=True)
          posts = r.fetch_posts(channels, dt.datetime.now(dt.timezone.utc))
          print('Buffer queue read successfully. Posts:', len(posts), flush=True)
          content = r.generate(config, dt.datetime.now(r.JST).date()+dt.timedelta(days=3), 'post', [])
          print('Cloudflare authenticated; generated content passed validation.', flush=True)
          print('No posts created or modified.', flush=True)
          PY

